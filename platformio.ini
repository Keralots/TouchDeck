; TouchDeck - Home Assistant and PC stats touch deck on the Guition JC3248W535
;
; 3.5" 320x480 IPS (AXS15231B over QSPI) + capacitive touch, ESP32-S3-N16R8
; (16MB flash / 8MB PSRAM). The panel is driven by src/deck_panel.cpp
; (spi_master QSPI, async DMA through internal bounce buffers, software
; rotation, TE-synced full frames) and every screen is composed by LVGL
; (src/deck_ui.cpp). PC metrics arrive from the StatNode Companion over UDP.
;
; Build with `pio run`. Never run two builds in parallel (.sconsign race).

[platformio]
default_envs = jc3248w535
; Own package folder: the pioarduino framework has the same package name as
; the espressif32 6.x one, and a 6.x project build replaces it in ~/.platformio.
core_dir = ~/.platformio-pioarduino

[env:jc3248w535]
; Toolchain pinned to an exact pioarduino release (Arduino 3.x / IDF 5.x): the
; task watchdog in main.cpp uses the IDF 5 config-struct API.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Portal files in web/ are gzipped into src/web_assets.h before each build.
extra_scripts = pre:scripts/web_embed.py
board_build.partitions = partitions_16mb.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.f_flash = 80000000L
board_build.flash_mode = qio
lib_deps =
    bblanchon/ArduinoJson@^7.0
    knolleary/PubSubClient@2.8
    ; Only for the AXS15231B init command table (deck_panel.cpp). 1.6.x is
    ; required by the Arduino 3.x core; exact pin, a minor bump has no upside.
    moononournation/GFX Library for Arduino@1.6.7
    ; Exact pin: the deck pipeline was measured against this release
    ; (flush-wait callback, snapshot API).
    lvgl/lvgl@9.5.0
    ; Home Assistant WebSocket client (deck_ha.cpp).
    links2004/WebSockets@2.6.1
build_flags =
    -D BOARD_VARIANT=\"jc3248w535\"
    -D BOARD_NAME=\"Guition_JC3248W535\"
    -D BOARD_PANEL=\"AXS15231B_320x480_QSPI\"
    -D BOARD_IS_JC3248W535=1
    -D BOARD_HAS_PSRAM=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Panel, TE and touch pins are constants in src/deck_panel.cpp and
    ; src/deck_touch.cpp.
    -D BACKLIGHT_PIN=1
    ; --- LVGL: configuration in include/lv_conf.h ---
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I include
