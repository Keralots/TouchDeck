; StatNode - PC sensor monitor on color displays
;
; Reuses the BambuHelper display chassis (LovyanGFX color UI + arc gauges + web
; portal) but the data source is PC sensor metrics pushed over UDP, not a Bambu
; printer over MQTT. No PubSubClient / MQTT TLS here.
;
; Maintained envs (all ST7789 240x240 square panels):
;   esp32s3, esp32s3_zero, ws_lcd_154, esp32c3
; The monitor faces are laid out and tuned for 240x240 only; the old 240x320
; (cyd, ws_lcd_200) and 320x480 (jc3248w535) envs were dropped 2026-07-18.
;
; Plain `pio run` builds only the default env (default_envs below).
; Build a specific env with `pio run -e <env>`. Build envs sequentially
; (never two in parallel - .sconsign race).

[platformio]
default_envs = esp32s3

; --- Shared library dependencies ---
; MQTT (PubSubClient) intentionally dropped vs BambuHelper - this project does
; not talk to a printer. ArduinoJson is kept for parsing the PC stats packets.
; Improv WiFi is vendored in lib/ImprovWiFi because the registry package's
; generic WiFi dependency shadows the ESP32 framework WiFi library.
[common]
; Toolchain is pinned to an exact pioarduino platform release. The Arduino 3.x
; core (IDF 5.x) is required: the task watchdog in main.cpp uses the IDF 5
; config-struct API, which does not exist on the stock espressif32 6.x platform
; (Arduino 2.0.17 / IDF 4.4). Pinning the exact version also keeps the framework
; and toolchain identical across dev machines.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
lib_deps =
    lovyan03/LovyanGFX@^1.2.19
    bblanchon/ArduinoJson@^7.0

; --- Shared profile for ESP32-S3 envs (4MB QIO, native USB CDC, OTA) ---
; Used by esp32s3, esp32s3_zero, ws_lcd_154. Envs override `board` and append
; to build_flags with `${s3_common.build_flags}` (PlatformIO does not merge
; lists in `extends`).
[s3_common]
platform = ${common.platform}
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_4mb.csv
board_build.arduino.memory_type = qio_qspi
lib_deps = ${common.lib_deps}
build_flags =
    -D ENABLE_OTA_AUTO=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; All current S3 envs drive ST7789 panels which need color inversion.
    -D USE_ST7789_INVERT=1

; =============================================================================
;  ESP32-S3 Super Mini + ST7789 240x240
; =============================================================================
[env:esp32s3]
extends = s3_common
board = lolin_s3_mini
build_flags =
    ${s3_common.build_flags}
    -D BOARD_VARIANT=\"esp32s3\"
    -D BOARD_NAME=\"LOLIN_ESP32-S3_Mini\"
    -D BOARD_PANEL=\"ST7789_240x240\"
    -D BOARD_IS_S3=1
    -D BACKLIGHT_PIN=13

; =============================================================================
;  Waveshare ESP32-S3-Zero + external ST7789 240x240
;  Module ESP32-S3FH4R2: 4MB flash QIO + 2MB PSRAM QSPI.
;  Built-in WS2812 RGB LED on GPIO21 - do not use GPIO21 for external LED.
; =============================================================================
[env:esp32s3_zero]
extends = s3_common
board = lolin_s3_mini
build_flags =
    ${s3_common.build_flags}
    -D BOARD_VARIANT=\"esp32s3_zero\"
    -D BOARD_NAME=\"Waveshare_ESP32-S3-Zero\"
    -D BOARD_PANEL=\"ST7789_240x240\"
    -D BOARD_IS_S3=1
    -D BOARD_IS_S3_ZERO=1
    -D BOARD_HAS_PSRAM
    -D BACKLIGHT_PIN=13

; =============================================================================
;  Waveshare ESP32-S3-Touch-LCD-1.54 (1.54" ST7789 240x240)
; =============================================================================
[env:ws_lcd_154]
extends = s3_common
board = esp32-s3-devkitc-1
build_flags =
    ${s3_common.build_flags}
    -D BOARD_VARIANT=\"ws_lcd_154\"
    -D BOARD_NAME=\"Waveshare_ESP32-S3-Touch-LCD-1.54\"
    -D BOARD_PANEL=\"ST7789_240x240_CST816T_ES8311\"
    -D BOARD_IS_WS154=1
    -D BACKLIGHT_PIN=46
    ; --- Battery power-hold + VBAT sense via ADC on GPIO1 ---
    ; VBAT routed through 160k/1% divider to GPIO1 (BAT_ADC). No I2C PMIC.
    ; I2C devices on 42/41: 0x15 CST816T touch, 0x18 ES8311 audio,
    ; 0x40 ES7210 audio ADC, 0x6B QMI8658 IMU.
    -D BAT_EN=2
    -D BOARD_HAS_BATTERY=1
    -D BOARD_HAS_BAT_ADC=1
    -D BAT_ADC_PIN=1
    -D BAT_VOLT_DIVIDER=3.0f
    ; --- Built-in buttons (Waveshare button example) ---
    -D BOARD_BTN_1=0
    -D BOARD_BTN_2=5
    -D BOARD_BTN_3=4
    ; --- Built-in speaker (ES8311 codec + I2S + PA) ---
    -D BOARD_HAS_ES8311_AUDIO=1
    -D AUDIO_I2C_ADDR=0x18
    -D AUDIO_I2C_SDA=42
    -D AUDIO_I2C_SCL=41
    -D AUDIO_I2S_PORT=0
    -D AUDIO_I2S_MCLK=8
    -D AUDIO_I2S_BCLK=9
    -D AUDIO_I2S_LRC=10
    -D AUDIO_I2S_DOUT=12
    -D AUDIO_PA_CTRL=7
    ; --- Touch (CST816 on I2C, shared bus with ES8311) ---
    -D USE_CST816=1
    -D CST816_SDA=42
    -D CST816_SCL=41
    -D CST816_RST=47
    -D CST816_IRQ=48

; =============================================================================
;  Guition JC3248W535 - 3.5" 320x480 IPS (AXS15231B QSPI) + touch deck
;  ESP32-S3-N16R8, 16MB flash / 8MB PSRAM. The panel is driven by
;  src/deck_panel.cpp (spi_master QSPI, async DMA through internal bounce
;  buffers, software rotation, TE-synced full frames) and the screen is
;  composed by LVGL (src/deck_ui.cpp). The metric faces still draw through
;  LovyanGFX into a PSRAM sprite that LVGL shows as the first page.
; =============================================================================
[env:jc3248w535]
platform = ${common.platform}
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_16mb.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.f_flash = 80000000L
board_build.flash_mode = qio
lib_deps =
    ${common.lib_deps}
    ; 1.6.x is required for the Arduino 3.x core: the 1.5.x databus sources call
    ; the pre-3.x spiFrequencyToClockDiv() signature and fail to compile. Only
    ; Arduino_ESP32QSPI + Arduino_AXS15231B are actually used (see
    ; src/lgfx_panel_axs15231b_agfx.hpp), but PlatformIO builds every source in
    ; the library, including the SPI DMA databus we never instantiate.
    ; Now used only for the AXS15231B init command table. Exact pin, not a
    ; caret range: a silent minor bump has no upside here.
    moononournation/GFX Library for Arduino@1.6.7
    ; Exact pin: the deck pipeline was measured against this release
    ; (RGB565_SWAPPED canvas, flush-wait callback, snapshot API).
    lvgl/lvgl@9.5.0
build_flags =
    -D BOARD_VARIANT=\"jc3248w535\"
    -D BOARD_NAME=\"Guition_JC3248W535\"
    -D BOARD_PANEL=\"AXS15231B_320x480_QSPI\"
    -D BOARD_IS_JC3248W535=1
    -D ENABLE_OTA_AUTO=1
    -D BOARD_HAS_PSRAM=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; --- Display (AXS15231B QSPI, 320x480 portrait native) ---
    ; Panel, TE and touch pins are constants in src/deck_panel.cpp and
    ; src/deck_touch.cpp.
    -D DISPLAY_320x480=1
    -D BACKLIGHT_PIN=1
    ; --- LVGL: configuration in include/lv_conf.h ---
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    ; --- Battery sense: cell (BAT node) via R26/R27 divider to GPIO5 ---
    ; Calibrated: metered cell 4.16V vs ADC pin 2.454V => 1.70x.
    -D BOARD_HAS_BATTERY=1
    -D BOARD_HAS_BAT_ADC=1
    -D BAT_ADC_PIN=5
    -D BAT_VOLT_DIVIDER=1.70f

; =============================================================================
;  ESP32-C3 Super Mini + ST7789 240x240
; =============================================================================
[env:esp32c3]
platform = ${common.platform}
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_4mb.csv
lib_deps = ${common.lib_deps}
build_flags =
    -D BOARD_VARIANT=\"esp32c3\"
    -D BOARD_NAME=\"LOLIN_ESP32-C3_Mini\"
    -D BOARD_PANEL=\"ST7789_240x240\"
    -D BOARD_IS_C3=1
    -D ENABLE_OTA_AUTO=1
    -D BACKLIGHT_PIN=5
    ; --- USB Serial (C3 native USB CDC) ---
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_LOW_RAM=1
    -D USE_ST7789_INVERT=1
