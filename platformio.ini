; TouchDeck - Home Assistant and PC stats touch deck.
;
; One firmware, several boards: each env selects a board with -D BOARD_IS_<name>;
; include/boards/<name>.h holds its geometry, pins and which drivers it uses.
; The panel is driven by src/deck_panel.cpp (frame compositor) over a
; per-display transport (deck_panel_qspi.cpp, deck_panel_dsi.cpp) and every
; screen is composed by LVGL (src/deck_ui.cpp). PC metrics arrive from the
; StatNode Companion over UDP.
;
; Build with `pio run -e <env>`. Never run two builds in parallel (.sconsign race).

[platformio]
default_envs = jc3248w535
; Own package folder: the pioarduino framework has the same package name as
; the espressif32 6.x one, and a 6.x project build replaces it in ~/.platformio.
core_dir = ~/.platformio-pioarduino

[common]
; Toolchain pinned to an exact pioarduino release (Arduino 3.x / IDF 5.x): the
; task watchdog in main.cpp uses the IDF 5 config-struct API.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
; The platform's esptool 5.2.0 cannot flash P4 rev 3.2 chips.
platform_packages = tool-esptoolpy @ https://github.com/pioarduino/registry/releases/download/0.0.1/esptoolpy-v5.6.0.zip
framework = arduino
monitor_speed = 115200
; Portal files in web/ are gzipped into src/web_assets.h before each build.
extra_scripts = pre:scripts/web_embed.py
board_build.partitions = partitions_16mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.f_flash = 80000000L
board_build.flash_mode = qio
lib_deps =
    bblanchon/ArduinoJson@^7.0
    knolleary/PubSubClient@2.8
    ; Exact pin: the deck pipeline was measured against this release
    ; (flush-wait callback, snapshot API).
    lvgl/lvgl@9.5.0
    ; Home Assistant WebSocket client (deck_ha.cpp).
    links2004/WebSockets@2.6.1
    ; Home Assistant covers (deck_http.cpp): DC-only decode of progressive JPEGs.
    bitbank2/JPEGDEC@1.8.5
; The framework default is -Os; composed frames build about 40 % faster at -O2.
build_unflags = -Os
build_flags =
    -O2
    -D BOARD_HAS_PSRAM=1
    ; --- LVGL: configuration in include/lv_conf.h ---
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I include
    ; Arduino's panic hook (set_arduino_panic_handler), used by src/crash_log.cpp.
    -Wl,--wrap=esp_panic_handler

; Guition JC3248W535: 3.5" 320x480 AXS15231B over QSPI, ESP32-S3-N16R8.
[env:jc3248w535]
platform = ${common.platform}
platform_packages = ${common.platform_packages}
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
extra_scripts = ${common.extra_scripts}
board_build.partitions = ${common.board_build.partitions}
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = ${common.board_upload.flash_size}
board_upload.maximum_size = ${common.board_upload.maximum_size}
board_build.f_flash = ${common.board_build.f_flash}
board_build.flash_mode = ${common.board_build.flash_mode}
lib_deps =
    ${common.lib_deps}
    ; Only for the AXS15231B init command table (deck_panel.cpp). 1.6.x is
    ; required by the Arduino 3.x core; exact pin, a minor bump has no upside.
    moononournation/GFX Library for Arduino@1.6.7
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    ; Board facts and pins: include/boards/jc3248w535.h
    -D BOARD_IS_JC3248W535=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Waveshare ESP32-P4-WIFI6-Touch-LCD-7B (EK79007 1024x600 MIPI-DSI, GT911,
; ES8311, WiFi through the on-board ESP32-C6 over ESP-Hosted). The two P4
; silicon lines need different builds: this one is for rev 3.x chips.
[env:ws_p4_7b]
platform = ${common.platform}
platform_packages = ${common.platform_packages}
board = esp32-p4_r3
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
extra_scripts = ${common.extra_scripts}
board_build.partitions = ${common.board_build.partitions}
board_upload.flash_size = ${common.board_upload.flash_size}
board_upload.maximum_size = ${common.board_upload.maximum_size}
board_build.f_flash = ${common.board_build.f_flash}
board_build.flash_mode = ${common.board_build.flash_mode}
lib_deps = ${common.lib_deps}
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    ; Board facts and pins: include/boards/ws_p4_7b.h
    -D BOARD_IS_WS_P4_7B=1

; The same board with pre-3.0 P4 silicon (rev 1.x).
[env:ws_p4_7b_rev1]
extends = env:ws_p4_7b
board = esp32-p4
